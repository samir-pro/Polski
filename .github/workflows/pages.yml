# Publishes the app to GitHub Pages on every push to the default branch.
# The site is static (no build step), so the repository root is deployed as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/polish-learning-app-06lhex", "main", "ccr-9eca7c8c-qfmtzd"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate course content
        run: node tools/validate.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
